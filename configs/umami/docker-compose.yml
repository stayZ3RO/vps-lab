# Umami analytics stack. The public Caddy route serves tracker paths only.
# Admin access uses the loopback publish through Tailscale Serve on port 8444.
name: umami

services:
  umami:
    # OCI index digest for the Umami 3.4.0 release, checked 2026-10-12.
    image: umamisoftware/umami:3.4.0@sha256:89b79efaffb7bff1f7137963f1edc31e543894b4a4a63a6f2c6cf59cc8f8fd4c
    container_name: umami
    restart: unless-stopped
    mem_limit: 768m
    environment:
      TZ: UTC
      DATABASE_URL: postgresql://umami:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/umami
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      # a.<domain> is proxied by Cloudflare (edge firewall accepts 80/443 from
      # Cloudflare ranges only), so the visitor address arrives in this header.
      CLIENT_IP_HEADER: CF-Connecting-IP
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - web
      - umami_internal
    depends_on:
      db:
        condition: service_healthy

  db:
    # OCI index digest for PostgreSQL 16 Alpine, checked 2026-10-12.
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: umami-db
    restart: unless-stopped
    mem_limit: 512m
    environment:
      TZ: UTC
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: umami
    volumes:
      - umami_db_data:/var/lib/postgresql/data
    networks:
      - umami_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  web:
    external: true
  umami_internal:
    internal: true

volumes:
  umami_db_data:
