name: Docker Compose Check

on:
  push:
    branches: [master]

jobs:
  docker-compose-check:
    name: Validate Docker Compose files
    runs-on: ubuntu-latest
    env:
      # CI-only placeholders. The umami example intentionally leaves these
      # blank, and config only needs non-empty values to interpolate. These
      # are not credentials and are never used to start a service.
      POSTGRES_PASSWORD: ci-placeholder-not-a-secret
      APP_SECRET: ci-placeholder-not-a-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker Compose configuration
        run: |
          for file in configs/*/docker-compose.yml; do
            dir="${file%/*}"
            if [ -f "$dir/.env.example" ]; then
              docker compose --env-file "$dir/.env.example" -f "$file" config --quiet
            else
              docker compose -f "$file" config --quiet
            fi
            echo "Validated $file"
          done
