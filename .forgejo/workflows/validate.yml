---
name: validate

on:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install tools
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            gzip \
            python3 \
            tar

      - name: Install gitleaks and Docker Compose
        run: |
          set -euo pipefail
          tools="$(mktemp -d "${RUNNER_TEMP:-/tmp}/forgejo-tools.XXXXXX")"
          case "$(uname -m)" in
            x86_64)
              gitleaks_arch=x64
              gitleaks_sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
              compose_arch=x86_64
              compose_sha=40343e21ca777173e69cff5dbafeb37c6f81f3b0d57d9e597f036e95eb63e76a
              ;;
            aarch64|arm64)
              gitleaks_arch=arm64
              gitleaks_sha=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
              compose_arch=aarch64
              compose_sha=733ec76717ceb59052a9609b9dadfb523b2df8eab57a54212872d10a58078ea2
              ;;
            *)
              echo "Unsupported architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          curl -fsSL -o "$tools/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_${gitleaks_arch}.tar.gz"
          printf '%s  %s\n' "$gitleaks_sha" "$tools/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$tools/gitleaks.tgz" -C "$tools" gitleaks
          chmod +x "$tools/gitleaks"
          curl -fsSL -o "$tools/docker-compose" \
            "https://github.com/docker/compose/releases/download/v5.6.0/docker-compose-linux-${compose_arch}"
          printf '%s  %s\n' "$compose_sha" "$tools/docker-compose" | sha256sum -c -
          chmod +x "$tools/docker-compose"
          printf '%s\n' "$tools" >> "$GITHUB_PATH"

      - name: Secret scan
        run: gitleaks git . --redact --no-banner

      - name: List Markdown files
        run: |
          set -euo pipefail
          echo "Markdown files found:"
          find . -name "*.md" | sort || true

      - name: Check tracked relative Markdown links
        run: |
          set -euo pipefail
          python3 scripts/check-relative-links.py --self-test
          python3 scripts/check-relative-links.py

      - name: Check for obvious sensitive files
        run: |
          set -euo pipefail
          echo "Checking for files that should not be committed..."
          FOUND="$(find . \
            -path "./.git" -prune -o \
            \( \
              -name ".env" -o \
              -name ".env.local" -o \
              -name ".env.production" -o \
              \( -name ".env.*" ! -name ".env.example" \) -o \
              -name "*.pem" -o \
              -name "*.key" -o \
              -name "*.p12" -o \
              -name "*.pfx" -o \
              -name "id_rsa" -o \
              -name "id_ed25519" \
            \) -print)"
          if [ -n "$FOUND" ]; then
            echo "Potential sensitive files found:"
            echo "$FOUND"
            exit 1
          fi
          echo "No obvious sensitive files found."

      - name: Check for empty Markdown files
        run: |
          set -euo pipefail
          EMPTY_MD="$(find . -name "*.md" -type f -empty -print)"
          if [ -n "$EMPTY_MD" ]; then
            echo "Empty Markdown files found:"
            echo "$EMPTY_MD"
            exit 1
          fi
          echo "No empty Markdown files found."

      - name: Validate Docker Compose files
        run: |
          set -euo pipefail
          # CI-only placeholders: the checked-in umami example leaves secrets
          # blank, and config only needs non-empty values to interpolate.
          export POSTGRES_PASSWORD=ci
          export APP_SECRET=ci
          for file in configs/*/docker-compose.yml; do
            dir="${file%/*}"
            if [ -f "$dir/.env.example" ]; then
              docker-compose --env-file "$dir/.env.example" -f "$file" config --quiet
            else
              docker-compose -f "$file" config --quiet
            fi
            echo "Validated $file"
          done
